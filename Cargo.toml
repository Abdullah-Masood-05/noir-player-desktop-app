[package]
name = "noir_player"
version = "1.1.3"
edition = "2021"
description = "Noir Player - A lightweight music player"
license = "MIT"

[dependencies]
gpui-kit = "0.6"
anyhow = "1"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
urlencoding = "2"
walkdir = "2"
lofty = "0.22"
rodio = { version = "0.21", features = ["symphonia-alac", "symphonia-aiff"] }
dirs = "6"
smol = "2"

[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[package.metadata.bundle]
name = "Noir Player"
identifier = "app.noirplayer.desktop"
icon = ["Noir_Player_Logo.png"]
category = "Music"
short_description = "Noir Player music player"
linux_use_terminal = false

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.dev.package."*"]
codegen-units = 1
debug = false
strip = "symbols"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
