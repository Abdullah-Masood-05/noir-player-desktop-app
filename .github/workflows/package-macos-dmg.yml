name: Package macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach DMG to'
        required: true
        default: 'v1.1.3'

permissions:
  contents: write

jobs:
  build-and-upload-dmg:
    name: Build and Upload DMG
    runs-on: macos-14
    steps:
      - name: Create DMG from release app bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Building DMG for Noir Player $VERSION (tag: $TAG)..."

          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"

          echo "Downloading macOS archive from release $TAG..."
          gh release download "$TAG" -p "noir-player-${VERSION}-macos-arm64.tar.gz"

          echo "Extracting Noir Player.app..."
          tar -xzf "noir-player-${VERSION}-macos-arm64.tar.gz"

          echo "Preparing DMG staging area..."
          STAGING="dmg-staging"
          mkdir -p "$STAGING"
          cp -R "Noir Player.app" "$STAGING/Noir Player.app"
          ln -s /Applications "$STAGING/Applications"

          DMG_NAME="noir-player-${VERSION}-macos-arm64.dmg"
          echo "Creating $DMG_NAME with hdiutil..."
          hdiutil create \
            -volname "Noir Player" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_NAME"

          echo "Verifying DMG format..."
          hdiutil info -plist "$DMG_NAME" | grep -q 'UDZO'

          echo "Generating SHA256 checksum..."
          shasum -a 256 "$DMG_NAME" > "${DMG_NAME}.sha256"

          echo "Uploading $DMG_NAME and checksum to GitHub release $TAG..."
          gh release upload "$TAG" "$DMG_NAME" "${DMG_NAME}.sha256" --clobber

          echo "Successfully uploaded $DMG_NAME to release $TAG!"
