name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft after checks and release-draft environment approval; run against an existing v* tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate tag, version and notes
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import tomllib
          manifest = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          version = manifest['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version), 'Unsupported release version'
          assert os.environ['RELEASE_REF'] == f'refs/tags/v{version}', 'Select an existing tag matching Cargo.toml, not a branch'
          notes = pathlib.Path('CHANGELOG.md').read_text()
          section = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## |\Z)', notes, re.M | re.S)
          assert section and section.group(1).strip(), 'Missing version-scoped changelog notes'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      skip_windows_installers: true
    permissions:
      contents: read
  package:
    needs: [validate, checks]
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1 libasound2-dev \
            dpkg-dev fakeroot desktop-file-utils
      - name: Check Apple SDK and Metal tools
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
          rustc --version --verbose
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: false
      - name: Build locked release binary
        run: cargo build --release --locked --target "$TARGET"
      - name: Install pinned cargo-bundle and prepare offline metadata
        if: runner.os != 'Windows'
        run: |
          cargo install cargo-bundle --version 0.11.0 --locked
          cargo fetch --locked
      - name: Cache Windows installer tools
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}/tauri
          key: windows-installer-tools-${{ runner.os }}-${{ runner.arch }}-bundler-2.9.4-utils-2.9.3
      - name: Generate and validate Windows installers
        if: runner.os == 'Windows'
        run: |
          cargo installer --release-dir "target/$TARGET/release"
          python - <<'PY'
          import os
          import pathlib
          import shutil
          release = pathlib.Path('target') / os.environ['TARGET'] / 'release'
          outputs = []
          for kind, pattern, suffix in (('msi', '*.msi', 'windows-x64.msi'), ('nsis', '*.exe', 'windows-x64-setup.exe')):
              installers = list((release / 'bundle' / kind).glob(pattern))
              assert len(installers) == 1, f'Expected exactly one {kind} installer: {installers}'
              installer = installers[0]
              assert installer.is_file() and installer.stat().st_size > 0, f'Empty or invalid {kind} installer'
              outputs.append((installer, f"noir-player-{os.environ['VERSION']}-{suffix}"))
          dist = pathlib.Path('dist')
          dist.mkdir(exist_ok=True)
          for installer, name in outputs:
              destination = dist / name
              shutil.copyfile(installer, destination)
              assert destination.stat().st_size == installer.stat().st_size
          PY
      - name: Bundle macOS application
        if: runner.os == 'macOS'
        env:
          CARGO_BUNDLE_SKIP_BUILD: 'true'
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo bundle --release --bin noir_player --target "$TARGET" --format osx
          python - <<'PY'
          import os
          import pathlib
          import plistlib
          import shutil
          import subprocess
          bundle_dir = pathlib.Path('target') / os.environ['TARGET'] / 'release/bundle/osx'
          apps = list(bundle_dir.glob('*.app'))
          assert apps, f"No .app bundle found in {bundle_dir}"
          app = apps[0]
          print(f"Found bundle: {app}")
          plist_path = app / 'Contents/Info.plist'
          info = plistlib.loads(plist_path.read_bytes())
          print(f"CFBundleIdentifier = {info.get('CFBundleIdentifier')}")
          print(f"CFBundleShortVersionString = {info.get('CFBundleShortVersionString')}")
          print(f"CFBundleExecutable = {info.get('CFBundleExecutable')}")
          print(f"CFBundleName = {info.get('CFBundleName')}")
          print(f"CFBundleIconFile = {info.get('CFBundleIconFile')}")
          info['CFBundleIdentifier'] = 'app.noirplayer.desktop'
          info['CFBundleName'] = 'Noir Player'
          info['CFBundleDisplayName'] = 'Noir Player'
          assert info['CFBundleShortVersionString'] == os.environ['VERSION'], \
              f"Version mismatch: plist={info['CFBundleShortVersionString']} env={os.environ['VERSION']}"
          executable = app / 'Contents/MacOS' / info['CFBundleExecutable']
          assert subprocess.check_output(['lipo', '-archs', str(executable)], text=True).strip() == 'arm64'
          # cargo-bundle only packs icons that already match a size icns
          # accepts, and the logo is 700x688, so it produced no icns at all and
          # left CFBundleIconFile unset. Build the icon set with the platform's
          # own tools instead. iconutil accepts these sizes and no others.
          iconset = pathlib.Path(os.environ['RUNNER_TEMP']) / 'noir.iconset'
          if iconset.exists():
              shutil.rmtree(iconset)
          iconset.mkdir()
          source = pathlib.Path('Noir_Player_Logo.png').resolve()
          for size in (16, 32, 128, 256, 512):
              for scale in (1, 2):
                  pixels = size * scale
                  suffix = '' if scale == 1 else '@2x'
                  subprocess.run([
                      'sips', '-z', str(pixels), str(pixels), str(source),
                      '--out', str(iconset / f'icon_{size}x{size}{suffix}.png'),
                  ], check=True, stdout=subprocess.DEVNULL)
          icns = pathlib.Path(os.environ['RUNNER_TEMP']) / 'noir.icns'
          subprocess.run(['iconutil', '-c', 'icns', str(iconset), '-o', str(icns)], check=True)
          resources = app / 'Contents/Resources'
          resources.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(icns, resources / 'noir_player.icns')
          info['CFBundleIconFile'] = 'noir_player.icns'

          # Unconditional: a bundle with no icon used to pass this step.
          icon_file = info.get('CFBundleIconFile', '')
          assert icon_file, 'The bundle declares no CFBundleIconFile'
          packed = app / 'Contents/Resources' / icon_file
          assert packed.is_file() and packed.stat().st_size > 0, f'Missing icon: {icon_file}'
          print(f'Packed {icon_file} ({packed.stat().st_size} bytes)')
          info['LSMinimumSystemVersion'] = '14.0'
          plist_path.write_bytes(plistlib.dumps(info))
          subprocess.run(['plutil', '-lint', str(plist_path)], check=True)
          pathlib.Path('dist').mkdir(exist_ok=True)
          dmg = pathlib.Path('dist') / f"noir-player-{os.environ['VERSION']}-macos-arm64.dmg"
          staging = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dmg-staging'
          if staging.exists():
              import shutil
              shutil.rmtree(staging)
          staging.mkdir()
          staged_app = staging / 'Noir Player.app'
          subprocess.run(['cp', '-r', str(app), str(staged_app)], check=True)
          (staging / 'Applications').symlink_to('/Applications')
          subprocess.run([
              'hdiutil', 'create',
              '-volname', 'Noir Player',
              '-srcfolder', str(staging),
              '-ov', '-format', 'UDZO',
              str(dmg),
          ], check=True)
          assert dmg.exists() and dmg.stat().st_size > 0
          info = subprocess.check_output(['hdiutil', 'imageinfo', '-plist', str(dmg)], text=True)
          assert 'UDZO' in info
          print(dmg)
          PY
      - name: Bundle and validate Debian package
        if: runner.os == 'Linux'
        env:
          CARGO_BUNDLE_SKIP_BUILD: 'true'
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo bundle --release --bin noir_player --target "$TARGET" --format deb
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import subprocess
          import tomllib
          manifest = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          app_id = manifest['package']['metadata']['bundle']['identifier']
          assert app_id == 'app.noirplayer.desktop'
          main = pathlib.Path('src/main.rs').read_text()
          assert re.search(r'app_id:\s*Some\("' + re.escape(app_id) + r'"\.into\(\)\)', main), 'GPUI app_id must match desktop identity'
          release = pathlib.Path('target') / os.environ['TARGET'] / 'release'
          packages = list((release / 'bundle/deb').glob('*.deb'))
          assert len(packages) == 1, 'Expected exactly one bundle'
          staging = pathlib.Path(os.environ['RUNNER_TEMP']) / 'noir-deb'
          subprocess.run(['dpkg-deb', '--raw-extract', str(packages[0]), str(staging)], check=True)
          desktop = staging / 'usr/share/applications/noir_player.desktop'
          text = desktop.read_text()
          text = re.sub(r'^Name=.*', 'Name=Noir Player', text, flags=re.M)
          text = text.replace('Icon=noir_player', f'Icon={app_id}')
          desktop.unlink()
          desktop = desktop.with_name(f'{app_id}.desktop')
          desktop.write_text(text + f'StartupWMClass={app_id}\n')
          icons = list((staging / 'usr/share/icons').rglob('*.png'))
          if not icons:
              icon_dir = staging / 'usr/share/icons/hicolor/256x256/apps'
              icon_dir.mkdir(parents=True, exist_ok=True)
              import shutil
              shutil.copyfile('Noir_Player_Logo.png', icon_dir / f'{app_id}.png')
              icons = [icon_dir / f'{app_id}.png']
          else:
              for icon in icons:
                  if icon.name != f'{app_id}.png':
                      icon.rename(icon.with_name(f'{app_id}.png'))
          subprocess.run(['desktop-file-validate', str(desktop)], check=True)
          binary = staging / 'usr/bin/noir_player'
          elf = subprocess.check_output(['readelf', '-h', str(binary)], text=True)
          assert 'Advanced Micro Devices X86-64' in elf
          control = staging / 'DEBIAN/control'
          metadata = control.read_text()
          analysis = pathlib.Path(os.environ['RUNNER_TEMP']) / 'noir-shlibs'
          (analysis / 'debian').mkdir(parents=True)
          (analysis / 'debian/control').write_text('Source: noir-player\n\n' + metadata)
          result = subprocess.check_output(['dpkg-shlibdeps', '-O', '-e' + str(binary)], cwd=analysis, text=True)
          depends = next(line.removeprefix('shlibs:Depends=') for line in result.splitlines() if line.startswith('shlibs:Depends='))
          dynamic = ['libvulkan1', 'libwayland-client0', 'libxkbcommon0', 'libxkbcommon-x11-0']
          subprocess.run(['dpkg-query', '-W', *dynamic], check=True)
          depends = ', '.join(sorted(set(depends.split(', ') + dynamic)))
          metadata = re.sub(r'^Depends:.*\n', '', metadata, flags=re.M)
          control.write_text(metadata + f'Depends: {depends}\n')
          with (staging / 'DEBIAN/md5sums').open('w') as sums:
              for path in sorted((staging / 'usr').rglob('*')):
                  if path.is_file():
                      sums.write(f'{hashlib.md5(path.read_bytes()).hexdigest()}  {path.relative_to(staging).as_posix()}\n')
          pathlib.Path('dist').mkdir(exist_ok=True)
          output = pathlib.Path('dist') / f"noir-player-{os.environ['VERSION']}-linux-x64.deb"
          subprocess.run(['dpkg-deb', '--build', '--root-owner-group', str(staging), str(output)], check=True)
          assert subprocess.check_output(['dpkg-deb', '-f', str(output), 'Architecture'], text=True).strip() == 'amd64'
          assert subprocess.check_output(['dpkg-deb', '-f', str(output), 'Version'], text=True).strip() == os.environ['VERSION']
          subprocess.run(['dpkg-deb', '--info', str(output)], check=True)
          subprocess.run(['dpkg-deb', '--contents', str(output)], check=True)
          PY
      - name: Build Fedora RPM package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import tomllib
          manifest = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          app_id = manifest['package']['metadata']['bundle']['identifier']
          version = os.environ['VERSION']
          workspace = pathlib.Path.cwd()
          home = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rpmbuild'
          top = home / 'rpmbuild'
          for sub in ('BUILD', 'RPMS', 'SOURCES', 'SPECS', 'SRPMS'):
              (top / sub).mkdir(parents=True)
          spec = '\n'.join([
              '%define _binary_payload w9.gzdio',
              'Name:           noir-player',
              f'Version:        {version}',
              'Release:        1%{?dist}',
              'Summary:        Noir Player music player',
              'License:        MIT',
              'URL:            https://github.com/Abdullah-Masood-05/noir-player-desktop-app',
              'AutoReqProv:    no',
              # Required by soname, not by package name: these libraries are
              # opened at run time, and every RPM distribution advertises the
              # soname while the package names differ. Fedora has no package
              # called "wayland", so requiring that name never resolved.
              'Requires:       libasound.so.2()(64bit)',
              'Requires:       libwayland-client.so.0()(64bit)',
              'Requires:       libxkbcommon.so.0()(64bit)',
              'Requires:       libxkbcommon-x11.so.0()(64bit)',
              'Requires:       libvulkan.so.1()(64bit)',
              '%description',
              'Noir Player music player.',
              '%prep',
              '%build',
              '%install',
              'mkdir -p %{buildroot}/usr/bin',
              f"install -m 755 {workspace / 'target' / os.environ['TARGET'] / 'release/noir_player'} %{{buildroot}}/usr/bin/noir_player",
              'mkdir -p %{buildroot}/usr/share/applications',
              f"cat > %{{buildroot}}/usr/share/applications/{app_id}.desktop <<'DESK'",
              '[Desktop Entry]',
              'Type=Application',
              'Name=Noir Player',
              'Comment=Noir Player music player',
              'Exec=noir_player',
              f'Icon={app_id}',
              'Terminal=false',
              'Categories=Audio;Music;Player;AudioVideo;',
              f'StartupWMClass={app_id}',
              'DESK',
              'mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps',
              f"cp {workspace / 'Noir_Player_Logo.png'} %{{buildroot}}/usr/share/icons/hicolor/256x256/apps/{app_id}.png",
              'mkdir -p %{buildroot}/usr/share/licenses/noir-player',
              f'install -m 644 {workspace / "LICENSE"} %{{buildroot}}/usr/share/licenses/noir-player/LICENSE',
              '%files',
              '/usr/bin/noir_player',
              f'/usr/share/applications/{app_id}.desktop',
              f'/usr/share/icons/hicolor/256x256/apps/{app_id}.png',
              '/usr/share/licenses/noir-player/LICENSE',
              '%changelog',
              f'* Thu Sep 17 2026 Abdullah Masood <Abdullah-Masood-05@users.noreply.github.com> - {version}-1',
              '- First RPM package of Noir Player.',
          ])
          (top / 'SPECS/noir-player.spec').write_text(spec)
          subprocess.run(['rpmbuild', '-bb', '--define', f'_topdir {top}', '--define', f'__strip /bin/true', str(top / 'SPECS/noir-player.spec')], cwd=workspace, check=True)
          rpm = next((top / 'RPMS/x86_64').glob('noir-player-*.rpm'))
          renamed = rpm.with_name(f"noir-player-{version}-linux-x64.rpm")
          rpm.rename(renamed)
          subprocess.run(['rpm', '-qp', '--info', str(renamed)], check=True)
          pathlib.Path('dist').mkdir(exist_ok=True)
          renamed.rename(pathlib.Path('dist') / renamed.name)
          PY
      - name: Build Arch Linux package (.pkg.tar.zst)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e TARGET \
            -e VERSION \
            archlinux:base-devel \
            bash -c "
              set -e
              pacman -Syu --noconfirm --needed git fakeroot
              useradd -m builduser
              echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              mkdir -p /tmp/archpkg/src
              cp /workspace/target/${TARGET}/release/noir_player /tmp/archpkg/src/noir_player
              cp /workspace/packaging/arch/app.noirplayer.desktop /tmp/archpkg/src/
              cp /workspace/Noir_Player_Logo.png /tmp/archpkg/src/app.noirplayer.desktop.png
              cp /workspace/LICENSE /tmp/archpkg/src/LICENSE
              cp /workspace/packaging/arch/PKGBUILD /tmp/archpkg/
              chown -R builduser:builduser /tmp/archpkg
              cd /tmp/archpkg
              su builduser -c 'makepkg -f --nodeps --skipchecksums'
              mkdir -p /workspace/dist
              cp /tmp/archpkg/noir-player-*.pkg.tar.zst /workspace/dist/
            "
          python3 -c "import glob,os; f=glob.glob('dist/*.pkg.tar.zst'); assert len(f)==1; os.replace(f[0], os.path.join('dist', f'noir-player-' + os.environ['VERSION'] + '-linux-x64.pkg.tar.zst'))"
      - name: Check lockfile and write SHA256 sidecar
        run: |
          git diff --exit-code -- Cargo.lock Cargo.toml
          python - <<'PY'
          import hashlib
          import pathlib
          files = list(pathlib.Path('dist').iterdir())
          assert files and all(asset.stat().st_size > 0 for asset in files)
          for asset in files:
              digest = hashlib.file_digest(asset.open('rb'), 'sha256').hexdigest()
              asset.with_name(asset.name + '.sha256').write_text(f'{digest}  {asset.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: noir-player-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release:
    needs: [validate, checks, package]
    if: github.repository == 'Abdullah-Masood-05/noir-player-desktop-app' && (github.event_name == 'push' || inputs.create_draft)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: noir-player-*
          path: dist
          merge-multiple: true
      - name: Verify complete artifact set and extract release notes
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          version = os.environ['VERSION']
          expected = [f'noir-player-{version}-{suffix}' for suffix in ('windows-x64.msi', 'windows-x64-setup.exe', 'macos-arm64.dmg', 'linux-x64.deb', 'linux-x64.rpm', 'linux-x64.pkg.tar.zst')]
          folder = pathlib.Path('dist')
          assert {path.name for path in folder.iterdir()} == set(expected + [name + '.sha256' for name in expected]), 'Incomplete or unexpected assets'
          sums = []
          for name in sorted(expected):
              asset = folder / name
              assert asset.stat().st_size > 0
              with asset.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              line = f'{digest}  {name}\n'
              assert (folder / (name + '.sha256')).read_text() == line, f'Checksum mismatch: {name}'
              sums.append(line)
          (folder / 'SHA256SUMS').write_text(''.join(sums))
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          match = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          assert match and match.group(1).strip()
          pathlib.Path('release-notes.txt').write_text(match.group(1).strip() + '\n')
          PY
      - name: Create or update release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, updating assets..."
            gh release upload "$RELEASE_TAG" dist/*.msi dist/*-setup.exe dist/*.dmg dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.sha256 dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --draft=false --title "Noir Player $VERSION" --notes-file release-notes.txt
          else
            gh release create "$RELEASE_TAG" dist/*.msi dist/*-setup.exe dist/*.dmg dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.sha256 dist/SHA256SUMS \
              --verify-tag --title "Noir Player $VERSION" --notes-file release-notes.txt
          fi
